<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Скачай камионче икона</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #f0f9ff; }
        h1 { color: #333; }
        svg { max-width: 300px; margin: 30px 0; }
        button { padding: 12px 30px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; margin: 10px; }
        .btn-download { background: #10b981; color: white; }
        .btn-download:hover { background: #059669; }
    </style>
</head>
<body>
    <h1>🚚 Транспортно камионче икона</h1>
    <svg width="300" height="300" viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg" id="truckSvg">
        <defs>
            <linearGradient id="truckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
                <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
            </linearGradient>
        </defs>
        <circle cx="190" cy="190" r="170" fill="#f0f9ff" stroke="#dbeafe" stroke-width="2"/>
        <g transform="translate(60, 120)">
            <rect x="40" y="30" width="200" height="100" rx="8" fill="url(#truckGrad)" stroke="#1e40af" stroke-width="2"/>
            <rect x="0" y="50" width="50" height="80" rx="6" fill="#1e40af" stroke="#0c2340" stroke-width="2"/>
            <rect x="8" y="58" width="34" height="28" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
            <rect x="0" y="135" width="50" height="8" fill="#ea580c" stroke="#92400e" stroke-width="1"/>
            <circle cx="28" cy="150" r="14" fill="#374151" stroke="#1f2937" stroke-width="2"/>
            <circle cx="160" cy="150" r="14" fill="#374151" stroke="#1f2937" stroke-width="2"/>
            <circle cx="190" cy="150" r="14" fill="#374151" stroke="#1f2937" stroke-width="2"/>
            <circle cx="8" cy="70" r="3" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
            <circle cx="8" cy="82" r="3" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
        </g>
        <g transform="translate(280, 240)">
            <circle cx="0" cy="0" r="20" fill="#10b981" stroke="#059669" stroke-width="2"/>
            <text x="0" y="8" font-size="24" font-weight="bold" text-anchor="middle" fill="#f0fdf4">€</text>
        </g>
    </svg>
    <button class="btn-download" onclick="downloadPNG()">⬇️ Скачай PNG</button>
    <script>
        function downloadPNG() {
            const svg = document.getElementById('truckSvg');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 512;
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, 512, 512);
            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0, 512, 512);
                const link = document.createElement('a');
                link.href = canvas.toDataURL('image/png');
                link.download = 'truck_icon.png';
                link.click();
            };
            const svgData = new XMLSerializer().serializeToString(svg);
            const svgBlob = new Blob([svgData], { type: 'image/svg+xml' });
            img.src = URL.createObjectURL(svgBlob);
        }
    </script>
</body>
</html>
